name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --release --locked

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/leaf.exe
          body: |
            ## Leaf ${{ github.ref_name }}

            **Download:** `leaf.exe` unten herunterladen und starten – keine Installation nötig.

            Optional als Standardbrowser einrichten: Repo herunterladen, `leaf.exe` in den Ordner legen und `install.ps1` ausführen.

            Voraussetzung: Windows 10/11 (WebView2 ist vorinstalliert).

            Hinweis: Die Datei ist nicht signiert. Falls Windows SmartScreen warnt: „Weitere Informationen“ → „Trotzdem ausführen“.
