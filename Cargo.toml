[package]
name = "leaf"
version = "0.2.0"
edition = "2021"
description = "Leaf - ein schlanker, schneller Browser in Rust"

[dependencies]
tao = "0.30"
wry = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.33"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
    "Win32_System_WinRT",
    "Win32_System_Com",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
